<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10Store</title>
    <link rel="stylesheet" href="css/default.css" />
</head>
<body>
    <header id="app-header" role="banner">
        <div class="header-left">
            <a href="pages/home.html" target="app-frame" style="text-decoration:none;">
                <div id="logo" class="logo-click">10Store</div>
            </a>
            <nav class="nav">
                <a href="pages/apps.html" id="btn-all" class="nav-btn" target="app-frame">All apps</a>
                <a href="https://drayaiupdatehost.netlify.app/10store/upload.html" id="btn-upload" class="nav-btn" target="app-frame">Upload</a>
                <a href="https://drayaiupdatehost.netlify.app/10store/feedback.html" id="btn-feedback" class="nav-btn" target="app-frame">Feedback</a>
            </nav>
        </div>

        <div class="header-right">
            <div class="search-wrap">
                <input id="search" type="search" placeholder="Search apps..." />
            </div>
        </div>
    </header>

    <main id="app-main">
        <iframe id="app-webview"
                name="app-frame"
                src="pages/home.html"
                frameborder="0"></iframe>
    </main>

    <div id="content-host">
        <div id="update-overlay">
            <div id="update-modal">
                <h2 style="margin-top:0;">Update Required</h2>
                <p>10Store is out of date.</p>
                <p style="font-size: 0.8em;">Please download the latest version from the Discord Server to continue using 10Store.</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
