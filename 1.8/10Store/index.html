<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10Store</title>
    <link rel="stylesheet" href="css/default.css" />
</head>
<body>
    <header id="app-header" role="banner">
        <div class="header-left">
            <button id="menu-toggle" class="icon-btn">☰</button>

            <a href="pages/home.html" target="app-frame" style="text-decoration:none;">
                <div id="logo" class="logo-click">10Store</div>
            </a>

            <nav id="side-drawer" class="nav">
                <a href="pages/apps.html" class="nav-btn" target="app-frame">All apps</a>
                <a href="pages/cache.html" class="nav-btn" target="app-frame">Downloads</a>
                <a href="https://drayaiupdatehost.netlify.app/10store/upload.html" class="nav-btn" target="app-frame">Upload</a>
                <a href="https://drayaiupdatehost.netlify.app/10store/feedback.html" class="nav-btn" target="app-frame">Feedback</a>
            </nav>
        </div>

        <div class="header-right">

            <div id="search-container" class="search-wrap">
                <input id="search" type="search" placeholder="Search" />
            </div>
        </div>
    </header>

    <div id="drawer-overlay"></div>

    <main id="app-main">
        <iframe id="app-webview"
                name="app-frame"
                src="pages/home.html"
                frameborder="0"></iframe>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
