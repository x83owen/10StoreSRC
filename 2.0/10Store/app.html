<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link id="winjs-theme" href="" rel="stylesheet" />
    <script src="winjs/base.js"></script>
    <script src="winjs/ui.js"></script>
    <style>
        * {
            outline: none !important;
        }

        :root {
            --accent: #0078d7;
        }

        html, body {
            margin: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .app-hero {
            display: flex;
            padding: 20px;
            align-items: flex-start;
        }

        .app-logo-big {
            width: 180px;
            height: 180px;
            background: var(--accent);
            object-fit: cover;
        }

        .app-info-right {
            margin-left: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
        }

        .app-publisher {
            color: #0078D7;
            text-decoration: none;
            display: block;
            margin: 5px 0 5px 0;
            cursor: default;
        }

        .app-version {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
            display: block;
        }

        .app-description {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-download {
            background-color: var(--accent);
        }

            .btn-download:disabled {
                display: none;
            }

        #dl-container {
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }

        progress {
            width: 100%;
            height: 4px;
            display: block;
            margin-top: 10px;
            color: var(--accent);
        }

        /* PORTRAIT MODE ADJUSTMENTS */
        @media screen and (orientation: portrait), screen and (max-width: 600px) {
            .app-hero {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .app-logo-big {
                width: 150px;
                height: 150px;
                margin-bottom: 15px;
            }

            .app-info-right {
                margin-left: 0;
                width: 100%;
                align-items: center;
            }

            .app-title {
                font-size: 28px;
                order: 1;
            }

            .app-publisher {
                order: 2;
                margin-bottom: 5px;
            }

            .app-version {
                order: 3;
                margin-bottom: 15px;
            }

            #dl-container {
                order: 4;
                width: 80%;
                margin-bottom: 20px;
                align-items: center;
            }

            .btn-download {
                width: 100%;
                align-self: stretch;
            }

            .app-description {
                order: 5;
                text-align: left;
                padding: 0 15px;
            }
        }
    </style>
</head>
<body class="win-type-body">
    <div id="app-content"><progress>IF_YOU_SEE_THIS_YOU_ARE_A_HACKER</progress></div>
    <script src="dataFILE.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
