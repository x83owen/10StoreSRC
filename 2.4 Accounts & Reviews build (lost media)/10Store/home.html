<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link id="winjs-theme" href="" rel="stylesheet" />
    <script src="winjs/base.js"></script>
    <script src="winjs/ui.js"></script>
    <link rel="stylesheet" href="css/cardstyles.css" />
    <style>
        * {
            outline: none !important;
        }

        :root {
            --accent: #0078d7;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: transparent !important;
        }

        body {
            overflow-y: auto;
            overflow-x: hidden;
            display: block;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin: 20px 20px 10px 20px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.3);
            padding-bottom: 5px;
        }

        .app-grid {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            margin-bottom: 30px;
            padding: 0 16px 12px 16px;
        }

        #hero-container {
            position: relative;
            width: 100%;
            height: 450px;
            margin-bottom: 40px;
            overflow: hidden;
            display: flex;
        }

        .hero-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            z-index: 1;
        }

            .hero-slide.active {
                opacity: 1;
                z-index: 2;
            }

        .hero-bg {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            background: var(--accent);
            filter: blur(50px);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 800px;
            padding: 20px;
        }

        .hero-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 25px;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
        }

        .hero-title {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .hero-desc {
            font-size: 18px;
            line-height: 1.5;
        }

        .hero-nav {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 80px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.4);
            font-size: 40px;
            z-index: 10;
        }

            .hero-nav:hover {
                background: rgba(255,255,255,0.1);
                color: var(--accent);
            }

        .hero-prev {
            left: 0;
        }

        .hero-next {
            right: 0;
        }
    </style>
</head>
<body class="win-type-body">
    <script src="js/dataFILE.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
