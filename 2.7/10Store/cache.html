<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link id="winjs-theme" href="" rel="stylesheet" />
    <script src="ms-appx-web:///lib/winjs-4.0.1/js/base.js"></script>
    <script src="ms-appx-web:///lib/winjs-4.0.1/js/ui.js"></script>
    <style>
        * {
            outline: none !important;
            box-sizing: border-box;
        }

        :root {
            --accent: #0078d7;
        }

        html, body {
            height: 100%;
            margin: 0;
            background-color: transparent !important;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            padding: 20px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
        }

        #scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-top: 0;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            border-top: 1px solid #e0e0e0;
        }

        .file-card {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid #e0e0e0;
            border-radius: 0;
            width: 100%;
        }

            .file-card:hover {
                background: var(--accent);
            }

        .file-info {
            flex: 1;
            min-width: 0;
            padding-right: 10px;
        }

        .file-name {
            font-weight: 600;
            font-size: 14px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .file-meta {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .btn-delete {
            background: #ff0000;
            color: #ffffff;
        }
    </style>
</head>
<body class="win-type-body">
    <div class="header-bar">
        <div class="page-title">Downloads</div>
    </div>

    <div id="scroll-container">
        <div id="file-list" class="file-list">
            <progress></progress>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/cache.js"></script>
</body>
</html>
