<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link id="winjs-theme" href="" rel="stylesheet" />
    <script src="lib/winjs-4.0.1/js/base.js"></script>
    <script src="lib/winjs-4.0.1/js/ui.js"></script>
    <link href="msapp-error.css" rel="stylesheet" />
    <script src="msapp-error.js"></script>
</head>
<body class="win-type-body">
    <div class="page" role="main" aria-label="No internet error">
        <div class="center-box" role="region" aria-labelledby="title" aria-describedby="desc">
            <h1 id="title" class="headline">Check your connection</h1>
            <p id="desc" class="subtext">10Store needs to be online. It looks like you're not.</p>
            <div class="actions" role="group" aria-label="Connection actions">
                <button id="refreshBtn" class="win-button">Refresh the page</button>
                <button id="checkBtn" class="win-button chkbtn">Check connection</button>
            </div>
        </div>
    </div>
</body>
</html>
